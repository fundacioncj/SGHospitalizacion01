services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgh01-backend
    volumes:
      - ./src/main/resources/application-docker.properties:/app/config/application.properties:ro
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - sghospitalizacion_net

networks:
  sghospitalizacion_net:
    external: true
